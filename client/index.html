<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetWave AI — Find Your Aesthetic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="topbar">
    <span class="logo">MeetWave</span>
    <span class="logo-tag">AI</span>
  </nav>

  <main class="page">

    <!-- Sample Slider (≤10vh) -->
    <section id="sampleSlider" class="slider" aria-label="Sample style cards">
      <div class="slider-track">
        <img src="http://localhost:5000/generated/28b11139-2d66-4d20-95ca-5607a3c754f7/comparison.png" alt="Sample 1" loading="lazy">
        <img src="http://localhost:5000/generated/48300c0c-eb19-48ed-bec8-3418358cf89a/comparison.png" alt="Sample 2" loading="lazy">
        <img src="http://localhost:5000/generated/f2566c6c-89e4-499d-b5bd-47e35455b5b0/comparison.png" alt="Sample 3" loading="lazy">
        <img src="http://localhost:5000/generated/28b11139-2d66-4d20-95ca-5607a3c754f7/comparison.png" alt="Sample 4" loading="lazy">
        <img src="http://localhost:5000/generated/48300c0c-eb19-48ed-bec8-3418358cf89a/comparison.png" alt="Sample 5" loading="lazy">
      </div>
    </section>

    <!-- Hero -->
    <header class="hero">
      <h1>See yourself in <em>12 styles</em>.</h1>
      <p>Drop a selfie. Get a premium style report in seconds.</p>
    </header>

    <!-- Upload Section -->
    <section id="uploadSection" class="upload-card">
      <input type="file" id="fileInput" accept="image/*" hidden />
      <label for="fileInput" class="upload-drop">
        <span class="upload-emoji">↑</span>
        <span class="upload-title">Upload your photo</span>
        <span class="upload-sub">JPEG or PNG · up to 5MB</span>
      </label>
      <button type="button" id="uploadBtn" class="btn btn-primary hidden">Generate my styles</button>
    </section>

    <!-- Loading: skeleton matches generated image aspect (1024×1536 = 2:3) -->
    <section id="loadingState" class="loading hidden">
      <p id="loadingText" class="muted skeleton-caption">Crafting your style report…</p>
      <div class="skeleton-card" aria-hidden="true">
        <div class="skeleton-shimmer"></div>
        <div class="skeleton-grid">
          <div class="skeleton-cell"></div><div class="skeleton-cell"></div><div class="skeleton-cell"></div>
          <div class="skeleton-cell"></div><div class="skeleton-cell"></div><div class="skeleton-cell"></div>
          <div class="skeleton-cell"></div><div class="skeleton-cell"></div><div class="skeleton-cell"></div>
          <div class="skeleton-cell"></div><div class="skeleton-cell"></div><div class="skeleton-cell"></div>
        </div>
      </div>
    </section>

    <!-- Results -->
    <section id="resultsSection" class="results hidden">
      <h2 class="results-title">Your style report is ready</h2>
      <p class="muted">All 12 styles · pay to reveal</p>
      <div id="resultsGrid"></div>
      <div id="bestMatchSection"></div>
    </section>

    <!-- Unlock -->
    <section id="unlockSection" class="unlock hidden">
      <div class="unlock-headline">
        <span class="lock-pill">🔒 Locked</span>
        <h3>Pay ₹19 to unlock & download</h3>
        <p class="muted">High-res PNG · all 12 styles · yours forever</p>
      </div>
      <div id="razorpayMount">
        <button type="button" id="unlockBtn" class="btn btn-accent">Unlock for ₹19</button>
      </div>
      <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
      <a id="downloadBtn" class="btn btn-primary hidden" download="meetwave-styles.png">↓ Download your report</a>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
